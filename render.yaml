# Render Blueprint for ME-CONNECT (a static site).
# Without the rewrite, opening or refreshing any page address other than "/" (for example /due-list) gets "Not Found" from the host.
# Without the cache headers, a phone can keep an old sw.js or index.html after a new version goes live and then ask for page files that no longer exist.
services:
  - type: web
    name: me-connect
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Set these in the Render dashboard (they are build-time values). Leave VITE_API_URL empty to keep the sample-data prototype.
    # Or leave them empty and edit public/config.js instead: it is read at run time, so no rebuild is needed to change the API address.
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_TENANT_HOST
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # the page shell and the service worker must always be checked fresh
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # config.js holds the API address and is read at run time
      - path: /config.js
        name: Cache-Control
        value: no-cache
      # built files have a hash in their name and never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
